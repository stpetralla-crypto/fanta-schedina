
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fanta Schedina</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      text-align: center;
      padding: 30px 15px;
      color: #172033;
    }
    .contenitore {
      background: white;
      max-width: 420px;
      margin: 40px auto;
      padding: 30px 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px #00000015;
    }
    h1 { color: #166534; }
    button {
      background: #16a34a;
      color: white;
      padding: 14px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="contenitore">
    <h1>🏆 Fanta Schedina</h1>
    <p>Benvenuto nella nostra competizione!</p>
    <p>Pronostica 4 partite e scala la classifica.</p>
    <button onclick="alert('Presto potrai giocare!')">
      Inizia a giocare
    </button>
  </div>
</body>
</html>
